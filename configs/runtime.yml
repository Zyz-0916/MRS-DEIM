print_freq: 100
output_dir: './logs'
checkpoint_freq: 12
plot_train_batch_freq: 12

sync_bn: True
find_unused_parameters: True
verbose_type: 'origin' 

use_amp: False  
scaler:
  type: GradScaler
  enabled: True


use_ema: True  
ema:
  type: ModelEMA
  decay: 0.9999  
  warmups: 1000  

cache_imgsz: 1600
ram_cache: False  

yolo_metrice: True